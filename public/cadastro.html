<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jach'a Ajayu - Cadastre-se</title>
    <link rel="shortcut icon" href="assets/imgs/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
    <header id="header">
        <div class="container">
            <a href="index.html"><img src="assets/imgs/logo/Jach'a_Ajayu_logoCircular.svg" alt=""></a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="minha_historia.html">Minha história</a></li>
                    <li><a href="cadastro.html">Cadastre-se</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div><!-- Container -->
    </header>
    <section class="banner">
        <div class="card_cadastro">
            <div class="logo-paisagem">
                <img src="assets/imgs/logo/Jach'a_Ajayu_logoPaissagem.svg" alt="">
            </div>
            <h1>Cadastre-se</h1>
            <div class="inputs">
                <input id="input_nome" type="text" placeholder="Nome" autocomplete="off">
                <input id="input_sobrenome" type="text" placeholder="Sobrenome" autocomplete="off">
                <input id="input_email" type="text" placeholder="E-mail" autocomplete="off">
                <input id="input_senha" type="password" placeholder="Senha" autocomplete="off">
            </div>
            <div class="mensagem_erro">
                <p id="mensagem_erro"></p>
            </div>
            <button onclick="cadastrar()">Cadastrar</button>
            <p class="login">Já possui um cadastro. <a href="login.html">Acesse sua conta aqui. </a></p>
        </div> <!-- Fim Card Cadastro -->
    </section>
    <footer class="footer">
        <p>© 2025 JACH’A AJAYU. Todos os direitos reservados</p>
        <a href="index.html"><img src="assets/imgs/logo/Jach'a_Ajayu_logoCircular.svg" alt=""></a>
    </footer>
</body>

</html>
<script>
    const caractEspecial = ["!", "@", "#", "$", "%", "&", "*", "<", ">", "(", ")", "?"]

    function mostrarErro(msg) {
        mensagem_erro.innerHTML = msg;
        mensagem_erro.style.color = "red";
    }

    function cadastrar() {
        var nome = input_nome.value,
            sobrenome = input_sobrenome.value,
            email = input_email.value,
            senha = input_senha.value;

        // Validação do Preenchimento de Todos os Campos
        if (nome == '' || sobrenome == '' || email == '' || senha == '') {
            mostrarErro(`Preencha todos os campos!`);
            return
        }

        // Validação do Nome
        if (nome.trim().length == 1) {
            mostrarErro("O nome precisa ter pelo menos 2 letras!");
            return
        }

        for (let i = 0; i < nome.length; i++) {
            let char = nome[i];
            if (!isNaN(nome[i]) || caractEspecial.includes(char)) {
                mostrarErro("O nome não pode conter números ou caracteres especiaisi!");
                return;
            }
        }

        // Validação do Sobrenome
        if (sobrenome.trim().length == 1) {
            mostrarErro("O sobrenome precisa ter pelo menos 2 letras!");
            return;
        }

        for (let i = 0; i < sobrenome.length; i++) {
            let char = sobrenome[i]
            if (!isNaN(sobrenome[i]) || caractEspecial.includes(char)) {
                mostrarErro("O sobrenome não pode conter números ou caracteres especiaisi!");
                return;
            }
        }

        // Validação do Email
        if (!email.includes("@") || !email.includes(".") || email.includes(' ')) {
            mostrarErro("Insira um email válido!");
            return;
        }

        // Validação da Senha
        if (senha.length < 8) {
            mostrarErro("A senha precisa ter pelo menos 8 caracteres!");
            return;
        }

        let temMaiuscula = false;
        let temMinuscula = false;
        let temNumero = false;
        let temEspecial = false;

        for (let i = 0; i < senha.length; i++) {
            let char = senha[i];

            // verifica maiúscula
            if (char >= 'A' && char <= 'Z') {
                temMaiuscula = true;
            }

            // verifica minúscula
            else if (char >= 'a' && char <= 'z') {
                temMinuscula = true;
            }

            // verifica número
            else if (!isNaN(char)) {
                temNumero = true;
            }

            // verifica caractere especial
            else if (caractEspecial.includes(char)) {
                temEspecial = true;
            }
        }

        // valida resultados
        if (!temMaiuscula || !temMinuscula || !temNumero || !temEspecial) {
            mostrarErro("A senha deve ter maiúsculas, minúsculas, números e um caractere especial!");
            return;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nome,
                sobrenomeServer: sobrenome,
                emailServer: email,
                senhaServer: senha
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    mensagem_erro.innerHTML ="Cadastro realizado com sucesso!";
                    mensagem_erro.style.color = "green";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }



</script>

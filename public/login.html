<head>

</head>

<body>
    <header id="header">
        <div class="container">
            <a href="index.html"><img src="assets/imgs/logo/Jach'a_Ajayu_logoCircular.svg" alt=""></a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="minha_historia.html">Minha história</a></li>
                    <li><a href="cadastro.html">Cadastre-se</a></li>

                </ul>
            </nav>
        </div><!-- Container -->
    </header>
    <section class="banner">
        <div class="card-login">
            <div class="logo-paisagem">
                <img src="assets/imgs/logo/Jach'a_Ajayu_logoPaissagem.svg" alt="">
            </div>
            <h1>Bem Vindo</h1>
            <form class="inputs">
                <input id="input_email" type="text" placeholder="E-mail">
                <input id="input_senha" type="password" placeholder="Senha">
            </form>
            <div class="mensagem_erro">
                <p id="mensagem_erro"></p>
            </div>

</html>
<script>
    function mostrarErro(msg) {
        mensagem_erro.innerHTML = msg;
        mensagem_erro.style.color = "red";
    }

    function login() {
        var email = input_email.value,
            senha = input_senha.value;

        // Validação do Preenchimento de Todos os Campos
        if (email == '' || senha == '') {
            mostrarErro("Preencha todos os campos!")
            return
        }

        // Email inválido
        if (!email.includes("@") || !email.includes(".") || email.includes(" ")) {
            mostrarErro("Insira um email válido!");
            return;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        window.location = "quiz.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;




        // // Tudo OK
        // mensagem_erro.innerHTML = "Cadastro realizado com sucesso!";
        // mensagem_erro.style.color = "green";

        // setTimeout(() => {
        //     window.location.href = "quiz.html";
        // }, 1500);
    }


</script>

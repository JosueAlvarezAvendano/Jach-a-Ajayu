<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jach'a Ajayu - Quiz</title>
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="shortcut icon" href="assets/imgs/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">    
    
</head>
<body>
    <nav class="menu_lateral">
        <img src="assets/imgs/logo/Jach'a_Ajayu_logoCircular.svg" alt="">
        <div class="usuario">
            <p id="nome_usuario"></p>
        </div>
        <button class="opcoes">
            <i class="bi bi-house-door"></i>
            <span class="texto_btn">Início</span>
        </button>
        <button class="opcoes">
            <i class="bi bi-columns-gap"></i>
            <span class="texto_btn">Dashboard</span>
        </button>
        <button class="opcoes">
            <i class="bi bi-bar-chart"></i>
            <span class="texto_btn">Ranking</span>
        </button>
        <button class="opcoes">
            <span class="icone"><i class="bi bi-x-lg"></i></span>
            <span class="texto_btn" onclick="sair()">Sair</span>
        </button>
    </nav> <!-- Fim - menu lateral -->

    <div class="tela"> <!-- NÃO MEXER NO HTML E CSS -->
        <!-- PRIMEIRA TELA -->
        <div class="cx_quiz_inicial" id="cx_quiz_inicial">
            <h1 class="titulo_inicial">Preparado para o desafio? Comece o quiz!</h1>
            <button class="iniciarQuiz" onclick="iniciarQuiz()">Iniciar Quiz</button>
        </div>

        <!-- SEGUNDA TELA -->
        <div class="cx_perguntas" id="cx_perguntas">
            
            <!-- Primeira Pergunta -->
            <legend>A dança Caporales foi inspirada em qual figura histórica?</legend>
            <div class="alternativas">
                <input id="opcao1" type="radio" name="primeira_pergunta" id="">
                <label for="opcao1">
                    Mineiros das montanhas de Potosí
                </label>

                <input id="opcao2" type="radio" name="primeira_pergunta">
                <label for="opcao2">
                    Capatazes afro-bolivianos
                </label>

                <input id="opcao3" type="radio" name="primeira_pergunta">
                <label for="opcao3">
                    Artesãos de La Paz
                </label>

                <input id="opcao4" type="radio" name="primeira_pergunta">
                <label for="opcao4">
                    Pastores andinos
                </label>
                <!-- Fim Primeira Pergunta -->
            </div>
            <button class="next" id="next"> Proxímo</button>
        </div>

    </div> <!-- FIM TELA -->

</body>
</html>
<script>
    var nome = sessionStorage.NOME_USUARIO;
    nome_usuario.innerHTML = `Olá, ${nome}`;

    function sair() {
        setTimeout(function () {
                        window.location = "login.html";
                    }, 1500);
    }

    function iniciarQuiz() {
        document.getElementById("cx_quiz_inicial").style.display = "none";
        document.getElementById("cx_perguntas").style.display = "flex";
    }

    function next() {
        
    }
</script>

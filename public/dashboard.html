<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jach'a Ajayu - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="shortcut icon" href="assets/imgs/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body onload="dashboard()">
    <nav class="menu_lateral"> <!-- Fim - menu lateral -->
        <img src="assets/imgs/logo/Jach'a_Ajayu_logoCircular.svg" alt="">
        <div class="usuario">
            <p id="nome_usuario"></p>
        </div>
        <button class="opcoes">
            <i class="bi bi-check2-circle"></i>
            <span class="texto_btn" onclick="inicio()">Quiz</span>
        </button>
        <button class="opcoes">
            <i class="bi bi-bar-chart"></i>
            <span class="texto_btn">Dashboard</span>
        </button>
        <button class="opcoes">
            <i class="bi bi-door-open"></i>
            <span class="texto_btn" onclick="sair()">Sair</span>
        </button>
    </nav> <!-- Fim - menu lateral -->


    <div class="tela">
        <div class="cx_dashboard"> <!-- FUNDO PRETO -->
            <div class="cx_kpis">
                <div class="kpi maiorPontuacao">
                    <span class="span_texto">Maior Pontuação:</span>
                    <span class="span_texto" id="maior_acerto" style="font-size: 2em;"></span>
                </div>
                <div class="kpi mediaPontuacao">
                    <span class="span_texto">Pontuação Média:</span>
                    <span class="span_texto" id="media_acertos" style="font-size: 2em;"></span>
                </div>
            </div> <!-- FIM CX KPIs -->

            <div class="cx_grafico">
                <div class="card_grafico">
                    <div class="grafico">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </div> <!-- FIM GRAFICO -->

            <div class="cx_ranking">
                <div class="ranking">
                    <h1>Ranking</h1>
                    <div class="titulo_coluna">
                        <div class="centralizar" style="width: 25%;">Posição:</div>
                        <div class="centralizar" style="width: 50%;">Nome:</div>
                        <div class="centralizar" style="width: 25%;">Acerto(%):</div>
                    </div>
                    <div class="dados_ranking">
                        <div class="dados_primeiro dados">
                            <div class="centralizar" style="width: 25%;">1º</div>
                            <div class="centralizar" id="nome_primeiro" style="width: 50%;"></div>
                            <div class="centralizar" id="pontuacao_primeiro" style="width: 25%;"></div>
                        </div>
                        <div class="dados_segundo dados">
                            <div class="centralizar" style="width: 25%;">2º</div>
                            <div class="centralizar" id="nome_segundo" style="width: 50%;"></div>
                            <div class="centralizar" id="pontuacao_segundo" style="width: 25%;"></div>
                        </div>
                        <div class="dados_terceiro dados">
                            <div class="centralizar" style="width: 25%;">3º</div>
                            <div class="centralizar" id="nome_terceiro" style="width: 50%;"></div>
                            <div class="centralizar" id="pontuacao_terceiro" style="width: 25%;"></div>
                        </div>
                        <div class="dados_quarto dados">
                            <div class="centralizar" style="width: 25%;">4º</div>
                            <div class="centralizar" id="nome_quarto" style="width: 50%;"></div>
                            <div class="centralizar" id="pontuacao_quarto" style="width: 25%;"></div>
                        </div>
                        <div class="dados_quinto dados">
                            <div class="centralizar" style="width: 25%;">5º</div>
                            <div class="centralizar" id="nome_quinto" style="width: 50%;"></div>
                            <div class="centralizar" id="pontuacao_quinto" style="width: 25%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- TELA DE FUNDO -->
    </div>
</body>

</html>
<script>

    var nome = sessionStorage.NOME_USUARIO;
    nome_usuario.innerHTML = `Olá, ${nome}`;

    function inicio() {
        window.location = "quiz.html";
    }

    function sair() {
        setTimeout(function () {
            window.location = "login.html";
        }, 500);
    }


    function dashboard() {

        var idUsuario = sessionStorage.ID_USUARIO;

        console.log("Chamei o entrar()");


        fetch(`/dados/pegarDados/${idUsuario}`, {

        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));

                    var maiorAcerto = json.maior_acerto;
                    var mediaAcertos = Number(json.media_acertos);

                    console.log(maiorAcerto, mediaAcertos)
                    console.log(mediaAcertos)
                    console.log(maiorAcerto)

                    maior_acerto.innerHTML = `${maiorAcerto}`
                    media_acertos.innerHTML = `${mediaAcertos.toFixed(1)}`;





                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })



        //INICIO DADOS RANKING
        fetch(`/dados/pegarRanking`, {

        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));

                    preencherRanking(json);

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })


        // INICIO DADOS GRAFICO
        fetch(`/dados/pegarGrafico/${idUsuario}`, {

            
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));

                    // SEPARANDO OS VALORES
                    let valores = [];
                    for (let i = 0; i < json.length; i++) {
                        valores.push(json[i].qtdAcertos);
                    }

                    // INTERTENDO A ORDEM DOS VALORES
                    let valoresInvertidos = [];
                    for (let i = valores.length - 1; i >= 0; i--) {
                        valoresInvertidos.push(valores[i]);
                    }
                    valores = valoresInvertidos;

                    // COLOCANDO O IDENTIFICADOS DA COLNA
                    let labels = [];
                    for (let i = 0; i < valores.length; i++) {
                        labels.push("Tentativa");
                    }


                    const ctx = document.getElementById('myChart');

                    new Chart(ctx, { /* type, data, options */
                        type: 'bar',
                        data: { /* JSON dos dados */
                            labels: labels, /* Nome das colunas */
                            datasets: [{
                                label: 'Quantidade de Acertos', /* Legenda */
                                backgroundColor: '#7cdb81',
                                borderColor: '#2E7D32',
                                data: valores, /* Valores dos pontos */
                                borderWidth: 3
                            }]
                        },
                        options: {
                            scales: {
                                y: { // Eixo Y
                                    beginAtZero: true, // Começa do zero
                                    ticks: {
                                        color: '#444', // Cor dos rótulos (ticks)
                                        font: {
                                            size: 12
                                        }
                                    },
                                    grid: {
                                        color: 'rgba(200, 200, 200, 0.3)', // Cor das linhas de grade
                                        borderColor: '#ccc',
                                    }
                                },
                                x: { // Eixo X
                                    ticks: {
                                        color: '#FFFFFF',
                                        font: {
                                            size: 12
                                        }
                                    },
                                    grid: {
                                        display: false // Oculta as linhas de grade do eixo X
                                    }
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: 'Histórico de Acertos por tentativa',
                                    color: '#FFFFFF', /* Cor da Fonte */
                                    font: { /* JSON da Fonte */
                                        size: 18, // Tamanho da fonte
                                        weight: 'bold'
                                    }
                                },
                                legend: { /* ESTILIZAÇÂO da Legenda */
                                    display: true,
                                    position: 'bottom', // Posição (top, bottom, left, right)
                                    labels: {
                                        color: '#FFFFFF', // Cor do texto da legenda
                                        font: {
                                            size: 14
                                        }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: '#333', // Cor de fundo do tooltip
                                    titleColor: '#fff', // Cor do título
                                    bodyColor: '#fff', // Cor do corpo do texto
                                    borderColor: '#ddd',
                                    borderWidth: 1,
                                    cornerRadius: 5, // Cantos arredondados

                                }
                            },
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                    //FIM DADOS GRAFICO


                });

            } else {

                console.log("Houve um erro ao tentar pegar dados do Grafico!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })


        return false;

    }


    function preencherRanking(lista) {
        document.getElementById("nome_primeiro").innerHTML = lista[0].nome;
        document.getElementById("pontuacao_primeiro").innerHTML = `${(lista[0].porcentagem * 100).toFixed(1)}%`;

        document.getElementById("nome_segundo").innerHTML = lista[1].nome;
        document.getElementById("pontuacao_segundo").innerHTML = `${(lista[1].porcentagem * 100).toFixed(1)}%`;

        document.getElementById("nome_terceiro").innerHTML = lista[2].nome;
        document.getElementById("pontuacao_terceiro").innerHTML = `${(lista[2].porcentagem * 100).toFixed(1)}%`;

        document.getElementById("nome_quarto").innerHTML = lista[3].nome;
        document.getElementById("pontuacao_quarto").innerHTML = `${(lista[3].porcentagem * 100).toFixed(1)}%`;

        document.getElementById("nome_quinto").innerHTML = lista[4].nome;
        document.getElementById("pontuacao_quinto").innerHTML = `${(lista[4].porcentagem * 100).toFixed(1)}%`;
    }


</script>
